# Publica frontend/ no GitHub Pages a cada push na branch principal.
#
# Pré-requisitos (uma vez só, no GitHub):
#   1. Settings → Pages → Source: "GitHub Actions".
#   2. ANTES de tornar o repositório público, cumprir o checklist de
#      docs/seguranca-publicacao.md (em especial: desativar signup no Supabase).
#
# O app é 100% estático (sem build) — o artefato é a pasta frontend/ como está.

name: Deploy (GitHub Pages)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - id: deployment
        uses: actions/deploy-pages@v4
